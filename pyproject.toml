[project]
name = "oficina-ai"
version = "0.11.1"
description = "Sistema de gestão para oficinas com agentes de IA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.58",
    "celery>=5.6.3",
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "django-htmx>=1.28.0",
    "django-storages>=1.14.6",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "openai>=2.49.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "qrcode[pil]>=8.2",
    "redis>=8.0.1",
    "reportlab>=5.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv",
    "migrations",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "agents", "config", "tests"]
