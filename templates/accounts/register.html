{% extends "layouts/base.html" %}
{% block title %}Cadastrar — Oficina AI{% endblock %}
{% block auth %}
<div class="auth-card">
  <h1>Criar conta</h1>
  <p>15 segundos para começar a operar.</p>
  <form method="post" class="d-grid gap-3 form-narrow">
    {% csrf_token %}
    <label class="form-label">Nome da oficina
      <input class="form-control" type="text" name="oficina" required>
    </label>
    <label class="form-label">Usuário
      <input class="form-control" type="text" name="username" required>
    </label>
    <label class="form-label">E-mail
      <input class="form-control" type="email" name="email">
    </label>
    <label class="form-label">Senha
      <input class="form-control" type="password" name="password" required>
    </label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button class="btn btn-primary" type="submit">Começar</button>
  </form>
  <p style="margin-top:1rem"><a href="{% url 'accounts:login' %}">Já tenho conta</a></p>
</div>
{% endblock %}
