{% extends "layouts/base.html" %}
{% block title %}{% if servico %}Editar{% else %}Novo{% endif %} serviço{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>{% if servico %}Editar serviço{% else %}Novo serviço{% endif %}</h1></div>
</div>
<form method="post" class="card card-body d-grid gap-3 form-narrow">
  {% csrf_token %}
  <label class="form-label">Nome<input class="form-control" name="nome" required value="{{ servico.nome|default:'' }}"></label>
  <label class="form-label">Descrição<textarea class="form-control" name="descricao" rows="3">{{ servico.descricao|default:'' }}</textarea></label>
  <label class="form-label">Preço<input class="form-control" name="preco" type="number" step="0.01" value="{{ servico.preco|default:'0' }}"></label>
  <label class="form-label">Tempo estimado (min)<input class="form-control" name="tempo_estimado_min" type="number" value="{{ servico.tempo_estimado_min|default:'60' }}"></label>
  {% if servico %}
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="ativo" id="servico-ativo" {% if servico.ativo %}checked{% endif %}>
    <label class="form-check-label" for="servico-ativo">Ativo</label>
  </div>
  {% endif %}
  <button class="btn btn-primary" type="submit">Salvar</button>
</form>
{% endblock %}
