{% extends "layouts/base.html" %}
{% block title %}{% if peca %}Editar{% else %}Nova{% endif %} peça{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>{% if peca %}Editar peça{% else %}Nova peça{% endif %}</h1></div>
</div>
<form method="post" class="card card-body d-grid gap-3 form-narrow">
  {% csrf_token %}
  <label class="form-label">Código<input class="form-control" name="codigo" value="{{ peca.codigo|default:'' }}"></label>
  <label class="form-label">Nome<input class="form-control" name="nome" required value="{{ peca.nome|default:'' }}"></label>
  <label class="form-label">Descrição<textarea class="form-control" name="descricao" rows="2">{{ peca.descricao|default:'' }}</textarea></label>
  <label class="form-label">Fornecedor
    <select class="form-select" name="fornecedor">
      <option value="">—</option>
      {% for f in fornecedores %}
      <option value="{{ f.pk }}" {% if peca and peca.fornecedor_id == f.pk %}selected{% endif %}>{{ f.nome }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="form-label">Custo<input class="form-control" name="custo" type="number" step="0.01" value="{{ peca.custo|default:'0' }}"></label>
  <label class="form-label">Preço de venda<input class="form-control" name="preco" type="number" step="0.01" value="{{ peca.preco|default:'0' }}"></label>
  <label class="form-label">Estoque<input class="form-control" name="estoque" type="number" step="0.01" value="{{ peca.estoque|default:'0' }}"></label>
  <label class="form-label">Estoque mínimo<input class="form-control" name="estoque_minimo" type="number" step="0.01" value="{{ peca.estoque_minimo|default:'0' }}"></label>
  <label class="form-label">Unidade<input class="form-control" name="unidade" value="{{ peca.unidade|default:'UN' }}"></label>
  {% if peca %}
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="ativo" id="peca-ativo" {% if peca.ativo %}checked{% endif %}>
    <label class="form-check-label" for="peca-ativo">Ativa</label>
  </div>
  {% endif %}
  <button class="btn btn-primary" type="submit">Salvar</button>
</form>
{% endblock %}
